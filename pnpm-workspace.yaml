packages:
  - "apps/*"
  - "packages/*"
# Tolerancja na wolne/niestabilne odpowiedzi lokalnego rejestru Verdaccio (pnpm 11
# ignoruje te ustawienia z .npmrc/ENV, więc muszą być tutaj).
fetchTimeout: 300000
fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2102.25'
  - '@angular-devkit/core@21.2.25'
  - '@angular-devkit/schematics@21.2.25'
  - '@angular/build@21.2.25'
  - '@angular/cli@21.2.25'
  - '@schematics/angular@21.2.25'
