spring.datasource.url=jdbc:h2:mem:banking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
banking.seed-mock-data=${BANKING_SEED_MOCK_DATA:false}

# Fixed 32+ byte HS256 test secret — never used outside the test classpath.
banking.jwt.secret=test-only-jwt-secret-value-not-for-prod-use
# Points nowhere reachable by default; tests that exercise /auth/login mock IdentityAccessClient instead.
banking.identity-access.base-url=http://localhost:19999

# F8 — CAS SLA auto-escalation sweep disabled in tests: @SpringBootTest contexts seed/mock cases
# with a past sla_due_at, and the sweep would race their GovernanceClient mocks/assertions.
banking.cases.sla-escalation.enabled=false
