spring.application.name=banking_backend
server.port=10520

spring.datasource.url=jdbc:postgresql://localhost:5432/banking
spring.datasource.username=banking
spring.datasource.password=banking
spring.jpa.hibernate.ddl-auto=validate
# Disabled so lazy-load bugs surface as LazyInitializationException in tests instead of being
# masked by the request-scoped session (controllers must only touch data mapped inside the
# @Transactional service layer).
spring.jpa.open-in-view=false

app.cors.allowed-origin=${BANKING_WEB_ORIGIN:http://localhost:10500}

# HS256 signing secret for banking_backend-issued JWTs. No default here on purpose — the
# .env.example / compose.yml local-dev default is the only place a fallback value lives.
banking.jwt.secret=${BANKING_JWT_SECRET}
# identity_access_mock base URL — property + env override, DNS name in compose.yml.
banking.identity-access.base-url=${BANKING_IDENTITYACCESS_BASEURL:http://localhost:10525}
# governance_mock base URL (internal-only service, no host port) — property + env override.
banking.governance.base-url=${BANKING_GOVERNANCE_BASEURL:http://localhost:10524}
# credit_risk_mock base URL (internal-only service, no host port) — property + env override.
banking.creditrisk.base-url=${BANKING_CREDITRISK_BASEURL:http://localhost:10522}
# card_processor_mock base URL (exposed on host) — property + env override, DNS name in compose.yml.
banking.cardprocessor.base-url=${BANKING_CARDPROCESSOR_BASEURL:http://localhost:10521}
# external_institutions_gateway_mock base URL (exposed on host for its /ui/** pages, but REST is
# called only by banking_backend — see docs/external_institutions_gateway_mock_contract/api.md).
banking.regulatorygateway.base-url=${BANKING_REGULATORYGATEWAY_BASEURL:http://localhost:10523}

# ZJC-03 — "kwota wolna" ceilings per enforcement kind, see EnforcementActionsService
# .validateKindAndProtectedAmount() javadoc for the source/year and the ALIMONY assumption.
# Simulation defaults, not binding legal advice — easy to override per environment.
banking.enforcement.protected-amount-limit.non-alimony=3604.50
banking.enforcement.protected-amount-limit.alimony=0.00

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Raw value of BANKING_SEED_MOCK_DATA (true/false/unset) — mapped to the Liquibase
# context "mock-data" (or a non-matching literal) by MockDataContextConfig, because
# Liquibase treats an empty/missing context list as "run everything", including seeds.
banking.seed-mock-data=${BANKING_SEED_MOCK_DATA:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

