spring.application.name=banking_backend
server.port=10520

spring.datasource.url=jdbc:postgresql://localhost:5432/banking
spring.datasource.username=banking
spring.datasource.password=banking
spring.jpa.hibernate.ddl-auto=validate
# Disabled so lazy-load bugs surface as LazyInitializationException in tests instead of being
# masked by the request-scoped session (controllers must only touch data mapped inside the
# @Transactional service layer).
spring.jpa.open-in-view=false

app.cors.allowed-origin=${BANKING_WEB_ORIGIN:http://localhost:10500}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Raw value of BANKING_SEED_MOCK_DATA (true/false/unset) — mapped to the Liquibase
# context "mock-data" (or a non-matching literal) by MockDataContextConfig, because
# Liquibase treats an empty/missing context list as "run everything", including seeds.
banking.seed-mock-data=${BANKING_SEED_MOCK_DATA:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

