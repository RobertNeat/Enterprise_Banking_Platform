spring.application.name=governance_mock
server.port=10524

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.mvc.problemdetails.enabled=true

# Whether to seed the approval queue / audit trail at startup with entries consistent with
# banking_backend's loan_application / loan_stage_transition seed (see db/changelog/seed/001-approval.sql,
# mapped to the Liquibase "mock-data" context by MockDataContextConfig).
governance.seed-mock-data=${GOVERNANCE_SEED_MOCK_DATA:true}

# Dedicated PostgreSQL instance shared by mock services (separate from banking_backend's own
# instance) — each mock gets its own schema; this module owns schema "governance".
spring.datasource.url=jdbc:postgresql://localhost:10527/mocks
spring.datasource.username=mocks
spring.datasource.password=mocks
# Creates the module's schema up front so Liquibase's own tracking tables
# (databasechangelog/databasechangeloglock) can live inside it too, rather than in "public".
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS governance
spring.jpa.properties.hibernate.default_schema=governance
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=governance
spring.liquibase.liquibase-schema=governance
