spring.application.name=governance_mock
server.port=10524

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.mvc.problemdetails.enabled=true

# Whether to seed the in-memory approval queue at startup with entries consistent with
# banking_backend's loan_application / loan_stage_transition seed (see ApprovalService.seed()).
# State is in-memory only (ConcurrentHashMap) — reset on restart regardless of this flag.
governance.seed-mock-data=${GOVERNANCE_SEED_MOCK_DATA:true}
