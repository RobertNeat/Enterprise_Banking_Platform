spring.application.name=external_institutions_gateway_mock
server.port=10523

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.mvc.problemdetails.enabled=true

# Zakladany delay odpowiedzi bramy sprawozdawczej KNF/NBP (ms); nadpisywany w testach na krotki czas.
gateway.submission.delay-ms=2500

# Serwis wolany bezposrednio z przegladarki/banking_web (inny origin) -- wzorzec dozwolonych originow dla REST.
gateway.cors.allowed-origin-patterns=${BANKING_WEB_ORIGIN:http://localhost:10500}

# Whether to seed in-memory enforcement cases at startup matching banking_backend's
# enforcement_case seed (see EnforcementService.seed()). In-memory only — reset on restart.
gateway.seed-mock-data=${GATEWAY_SEED_MOCK_DATA:true}
