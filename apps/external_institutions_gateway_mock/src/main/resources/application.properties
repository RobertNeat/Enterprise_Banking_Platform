spring.application.name=external_institutions_gateway_mock
server.port=10523

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.mvc.problemdetails.enabled=true

# Zakladany delay odpowiedzi bramy sprawozdawczej KNF/NBP (ms); nadpisywany w testach na krotki czas.
gateway.submission.delay-ms=2500

# Serwis wolany bezposrednio z przegladarki/banking_web (inny origin) -- wzorzec dozwolonych originow dla REST.
gateway.cors.allowed-origin-patterns=${BANKING_WEB_ORIGIN:http://localhost:10500}

# Whether to seed enforcement cases / regulatory submissions at startup matching banking_backend's
# enforcement_case / report_submission seeds (see db/changelog/seed/, mapped to the Liquibase
# "mock-data" context by MockDataContextConfig).
gateway.seed-mock-data=${GATEWAY_SEED_MOCK_DATA:true}

# Dedicated PostgreSQL instance shared by mock services (separate from banking_backend's own
# instance) — each mock gets its own schema; this module owns schema "gateway".
spring.datasource.url=jdbc:postgresql://localhost:10527/mocks
spring.datasource.username=mocks
spring.datasource.password=mocks
# Creates the module's schema up front so Liquibase's own tracking tables
# (databasechangelog/databasechangeloglock) can live inside it too, rather than in "public".
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS gateway
spring.jpa.properties.hibernate.default_schema=gateway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=gateway
spring.liquibase.liquibase-schema=gateway
