# Schema first, then seed data. Every seed changeset carries context:mock-data and only runs
# when GATEWAY_SEED_MOCK_DATA=true (see MockDataContextConfig in this module).
databaseChangeLog:
  - include: { file: schema/001-enforcement-case.sql, relativeToChangelogFile: true }
  - include: { file: schema/002-fatca-crs-export.sql, relativeToChangelogFile: true }
  - include: { file: schema/003-regulatory-submission.sql, relativeToChangelogFile: true }

  - include: { file: seed/001-enforcement-case.sql, relativeToChangelogFile: true }
  - include: { file: seed/002-regulatory-submission.sql, relativeToChangelogFile: true }
