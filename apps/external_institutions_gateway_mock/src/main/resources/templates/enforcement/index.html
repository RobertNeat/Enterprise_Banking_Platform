<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>external_institutions_gateway_mock</title>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>

<div class="card">
    <h2>Symulacja przychodzacego zajecia komorniczego</h2>
    <form method="post" th:action="@{/ui/enforcement}">
        <div class="field"><label>Komornik: <input type="text" name="bailiff" required="required"/></label></div>
        <div class="field"><label>Numer sprawy: <input type="text" name="caseNumber" required="required"/></label></div>
        <div class="field"><label>Klient: <input type="text" name="customer" required="required"/></label></div>
        <div class="field"><label>Kwota zablokowana: <input type="number" step="0.01" name="blockedAmount" required="required"/></label></div>
        <div class="field"><label>Kwota wolna od zajecia: <input type="number" step="0.01" name="protectedAmount"/></label></div>
        <button type="submit">Zarejestruj zajecie</button>
    </form>
</div>

<div class="card">
    <h2>Skrzynka odbiorcza zajec</h2>
    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>Id</th><th>Klient</th><th>Komornik</th><th>Nr sprawy</th>
                <th>Zablokowano</th><th>Przekazano</th><th>Wolne od zajecia</th><th>Status</th><th>Utworzono</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${cases}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.customer}"></td>
                <td th:text="${c.bailiff}"></td>
                <td th:text="${c.caseNumber}"></td>
                <td th:text="${c.blockedAmount}"></td>
                <td th:text="${c.transferredAmount}"></td>
                <td th:text="${c.protectedAmount}"></td>
                <td th:text="${c.status}"></td>
                <td th:text="${c.createdAt}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
