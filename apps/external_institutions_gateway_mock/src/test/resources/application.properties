spring.datasource.url=jdbc:h2:mem:gateway;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Same schema-creation mechanism as production (see main application.properties) so Liquibase's
# tracking tables and this module's tables both land in "gateway", not the default schema.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS gateway
spring.jpa.properties.hibernate.default_schema=gateway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=gateway
spring.liquibase.liquibase-schema=gateway

spring.mvc.problemdetails.enabled=true
gateway.cors.allowed-origin-patterns=http://localhost:*
gateway.seed-mock-data=${GATEWAY_SEED_MOCK_DATA:true}
