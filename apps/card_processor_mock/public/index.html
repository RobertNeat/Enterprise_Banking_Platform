<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"

    <link rel="stylesheet" href="/css/theme-vars.css" />
    <style>
      header.app-header {
        background: var(--primary-color, #2c3e50);

          <p class="card-text">

            <code>/cards/:cardId/block</code>,

            <code>/processor/status</code>.

      </div>
