spring.application.name=identity_access_mock
server.port=10525

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Origin przegladarkowy banking_web - serwis wolany bezposrednio z hosta.
app.cors.allowed-origin=${BANKING_WEB_ORIGIN:http://localhost:10500}

# Whether to seed demo accounts/devices at startup, consistent with banking_web's DemoAccount list
# (see db/changelog/seed/001-employee-account.sql, 002-device.sql, mapped to the Liquibase
# "mock-data" context by MockDataContextConfig).
identity-access.seed-mock-data=${IDENTITY_ACCESS_SEED_MOCK_DATA:true}

# Dedicated PostgreSQL instance shared by mock services (separate from banking_backend's own
# instance) - each mock gets its own schema; this module owns schema "identity_access".
spring.datasource.url=jdbc:postgresql://localhost:10527/mocks
spring.datasource.username=mocks
spring.datasource.password=mocks
# Creates the module's schema up front so Liquibase's own tracking tables
# (databasechangelog/databasechangeloglock) can live inside it too, rather than in "public".
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS identity_access
spring.jpa.properties.hibernate.default_schema=identity_access
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=identity_access
spring.liquibase.liquibase-schema=identity_access
