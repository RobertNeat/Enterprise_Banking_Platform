<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>E-banking — identity_access_mock</title>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <div class="card">
        <h2>Odblokowanie dostępu e-banking</h2>
        <p>Wymaga wcześniej wygenerowanego kodu OTP o celu <code>UNLOCK_ACCESS</code> (przez REST
            <code>POST /otp/request</code> z <code>purpose: UNLOCK_ACCESS</code>) — zobacz
            <a th:href="@{/otp}">panel OTP</a> dla <code>otpId</code> i kodu.</p>
        <p th:if="${result != null}" th:text="${result}"></p>
        <!--/* nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -- Thymeleaf form, not Django; rule has no Spring equivalent. Mock has no Spring Security/session on classpath, so there is no CSRF token to emit. */-->
        <form th:action="@{/ebanking/unlock-ui}" method="post">
            <div class="field">
                <label for="userId">userId</label>
                <input type="text" id="userId" name="userId" required="required"/>
            </div>
            <div class="field">
                <label for="otpId">otpId</label>
                <input type="text" id="otpId" name="otpId" required="required"/>
            </div>
            <div class="field">
                <label for="code">Kod OTP</label>
                <input type="text" id="code" name="code" required="required"/>
            </div>
            <button type="submit">Odblokuj</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
