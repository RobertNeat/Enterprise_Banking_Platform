# Schema first, then seed data. Every seed changeset carries context:mock-data and only runs
# when IDENTITY_ACCESS_SEED_MOCK_DATA=true (see MockDataContextConfig in this module).
databaseChangeLog:
  - include: { file: schema/001-employee-account.sql, relativeToChangelogFile: true }
  - include: { file: schema/002-auth-session.sql, relativeToChangelogFile: true }
  - include: { file: schema/003-device.sql, relativeToChangelogFile: true }
  - include: { file: schema/004-otp-code.sql, relativeToChangelogFile: true }

  - include: { file: seed/001-employee-account.sql, relativeToChangelogFile: true }
  - include: { file: seed/002-device.sql, relativeToChangelogFile: true }
