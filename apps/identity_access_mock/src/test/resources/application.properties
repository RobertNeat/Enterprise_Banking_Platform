spring.datasource.url=jdbc:h2:mem:identity_access;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Same schema-creation mechanism as production (see main application.properties) so Liquibase's
# tracking tables and this module's tables both land in "identity_access", not the default schema.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS identity_access
spring.jpa.properties.hibernate.default_schema=identity_access
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=identity_access
spring.liquibase.liquibase-schema=identity_access

app.cors.allowed-origin=http://localhost:10500
identity-access.seed-mock-data=${IDENTITY_ACCESS_SEED_MOCK_DATA:true}
